    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            font-family: 'Tajawal', sans-serif;
            background: #0c0a09;
            color: #faf7f2;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 100% -20%, rgba(212,175,106,0.09), transparent),
                radial-gradient(ellipse 60% 40% at 0% 100%, rgba(184,146,74,0.06), transparent);
            pointer-events: none;
        }
        .lock-box {
            position: relative;
            background: #1c1917;
            border: 1px solid rgba(212,175,106,0.25);
            border-radius: 22px;
            padding: 2.6rem 2rem;
            width: 90%;
            max-width: 390px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.55);
        }
        .lock-icon {
            width: 70px; height: 70px;
            margin: 0 auto 1.2rem;
            background: linear-gradient(135deg, #d4af6a, #b8924a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            color: #0c0a09;
            box-shadow: 0 6px 20px rgba(212,175,106,0.3);
        }

            font-size: 1.4rem;

            margin-bottom: 0.4rem;

            font-size: 0.95rem;
            color: #a8a29e;
            margin-bottom: 1.8rem;
            line-height: 1.6;
        }
        input {
            width: 100%;
            padding: 0.95rem 1.2rem;
            border: 1.5px solid rgba(212,175,106,0.25);
            border-radius: 50px;
            background: #0c0a09;
            color: #faf7f2;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            margin-bottom: 1.15rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #d4af6a;
            box-shadow: 0 0 0 3px rgba(212,175,106,0.15);
        }
        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #d4af6a, #b8924a);
            color: #0c0a09;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        button:hover { opacity: 0.93; }
        button:active { transform: scale(0.98); }
        .error {
            color: #f87171;
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }
        .error.show { display: block; }
        .footer {
            margin-top: 1.8rem;
            font-size: 0.78rem;
            color: #78716c;
        }
        .footer span { color: #d4af6a; font-weight: 700; }
        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(12,10,9,0.3);
            border-top-color: #0c0a09;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        button.loading .btn-text { display: none; }
        button.loading .spinner { display: block; }
    </style>
</head>

        const passInput = document.getElementById('passInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMsg');

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 120000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function decrypt(password) {
            try {
                const salt = Uint8Array.from(atob(SALT), c => c.charCodeAt(0));
                const iv = Uint8Array.from(atob(IV), c => c.charCodeAt(0));
                const authTag = Uint8Array.from(atob(AUTH_TAG), c => c.charCodeAt(0));
                const ciphertext = Uint8Array.from(atob(ENCRYPTED), c => c.charCodeAt(0));

                const data = new Uint8Array(ciphertext.length + authTag.length);
                data.set(ciphertext);
                data.set(authTag, ciphertext.length);

                const key = await deriveKey(password, salt);
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    data
                );
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                return null;
            }
        }

        async function tryUnlock() {
            const password = passInput.value.trim();
            if (!password) {
                errorMsg.textContent = 'الرجاء إدخال الرقم السري';
                errorMsg.classList.add('show');
                return;
            }

            unlockBtn.classList.add('loading');
            errorMsg.classList.remove('show');

            await new Promise(r => setTimeout(r, 350));

            const html = await decrypt(password);
            unlockBtn.classList.remove('loading');

            if (html) {
                document.open();
                document.write(html);
                document.close();
            } else {
                errorMsg.textContent = 'الرقم السري غير صحيح';
                errorMsg.classList.add('show');
                passInput.value = '';
                passInput.focus();
            }
        }

        unlockBtn.addEventListener('click', tryUnlock);
        passInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') tryUnlock();
        });
    })();
